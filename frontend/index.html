<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homematic Thermostat Configurator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Homematic Thermostat Configurator</h1>
    <nav style="display:flex;align-items:center;gap:1.5rem">
      <a href="/dashboard" style="color:#3b82f6;text-decoration:none;font-size:0.9rem;font-weight:500">Gasverbrauch Dashboard</a>
      <div id="connection-status"></div>
    </nav>
  </header>

  <main>
    <aside id="device-list">
      <h2>Thermostate</h2>
      <div id="devices-loading">Lade Geraete...</div>
      <ul id="devices"></ul>
    </aside>

    <section id="editor" class="hidden">
      <div id="editor-header">
        <h2 id="device-name"></h2>
        <div id="editor-actions">
          <button id="btn-save" class="btn btn-primary">Speichern</button>
          <button id="btn-reload" class="btn btn-secondary">Neu laden</button>
        </div>
      </div>

      <div id="schedule-grid"></div>

      <div id="toast" class="hidden"></div>
    </section>
  </main>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h3>Zeitslot bearbeiten</h3>
      <div class="modal-field">
        <label for="slot-end">Ende (HH:MM):</label>
        <input type="time" id="slot-end" step="300">
      </div>
      <div class="modal-field">
        <label for="slot-temp">Temperatur (C):</label>
        <input type="number" id="slot-temp" min="4.5" max="30.5" step="0.5">
      </div>
      <div class="modal-actions">
        <button id="modal-save" class="btn btn-primary">OK</button>
        <button id="modal-delete" class="btn btn-danger">Loeschen</button>
        <button id="modal-cancel" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
